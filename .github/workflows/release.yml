name: Publish BridgeSpan release

on:
  push:
    tags:
      - 'v[0-9]*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Verify version and package
        run: python3 scripts/package.py --tag "$GITHUB_REF_NAME"
      - name: Run offline regressions
        run: |
          npm ci --ignore-scripts
          python3 scripts/test.py
      - name: Publish installable ZIP
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "dist/BridgeSpan-$GITHUB_REF_NAME.zip" \
            --verify-tag --title "BridgeSpan $GITHUB_REF_NAME" \
            --notes-file dist/release-notes.md --latest
