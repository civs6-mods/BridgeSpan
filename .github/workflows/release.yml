name: Publish BridgeSpan release

on:
  push:
    tags:
      - 'v[0-9]*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing mod version tag (e.g. v51)
        type: string
        required: true

concurrency:
  group: bridgespan-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Check tag format
        run: '[[ "$RELEASE_TAG" =~ ^v[1-9][0-9]*$ ]]'
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          persist-credentials: false
      - name: Verify version and package
        run: python3 scripts/package.py --tag "$RELEASE_TAG"
      - name: Run offline regressions
        run: |
          npm ci --ignore-scripts
          python3 scripts/test.py
      - name: Publish installable ZIP
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          zip="BridgeSpan-$RELEASE_TAG.zip"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release download "$RELEASE_TAG" --pattern "$zip" --dir "$RUNNER_TEMP/previous-release"
            cmp "dist/$zip" "$RUNNER_TEMP/previous-release/$zip"
          else
            gh release create "$RELEASE_TAG" "dist/$zip" \
              --verify-tag --title "BridgeSpan $RELEASE_TAG" \
              --notes-file dist/release-notes.md --latest
          fi
